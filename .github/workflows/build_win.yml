name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Exe
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r ModManagerGUI/requirements-local.txt

    - name: Build self-contained exe with PyInstaller
      run: |
        cd ModManagerGUI
        pyinstaller --clean --noconfirm --windowed --onefile --name WoTModAssistant main.py

    - name: Zip exe
      run: |
        $exe = "ModManagerGUI/dist/WoTModAssistant/WoTModAssistant.exe"
        Compress-Archive -Path $exe -DestinationPath "WoTModAssistant-win.zip"

    - name: Create a new release
      uses: softprops/action-gh-release@v2
      with:
        name: WoTModAssistant ${{ github.run_number }}
        files: WoTModAssistant-win.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
